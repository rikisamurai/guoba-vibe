[project]
name = "handbook-search"
version = "0.1.0"
description = "Fast, cited answers over the public GitLab Handbook"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=2.2,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
models = [
  "sacremoses>=0.1,<1",
  "sentence-transformers>=5,<6",
  "sentencepiece>=0.2,<1",
  "torch>=2.7,<3",
  "transformers>=4.53,<5",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
handbook-search = "handbook_search.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handbook_search"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
