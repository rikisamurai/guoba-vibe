name: Deep Link Lab

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deep-link-lab.yml'
      - 'apps/deep-link-lab/**'
      - '.npmrc'
      - '.nvmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter deep-link-lab lint
      - run: pnpm --filter deep-link-lab test
      - run: pnpm --filter deep-link-lab build
