name: React Doctor

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/qr-codes/**'

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: millionco/react-doctor@v2.1.0
        with:
          directory: apps/qr-codes
          blocking: error
          version: 0.5.1
