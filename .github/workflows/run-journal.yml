name: Run Journal

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/run-journal/**'
      - '.github/workflows/run-journal.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter run-journal lint
      - run: pnpm --filter run-journal test
      - run: pnpm --filter run-journal build
