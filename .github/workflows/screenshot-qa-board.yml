name: Screenshot QA Board

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/screenshot-qa-board.yml'
      - 'apps/screenshot-qa-board/**'
      - '.npmrc'
      - '.nvmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter screenshot-qa-board lint
      - run: pnpm --filter screenshot-qa-board test
      - run: pnpm --filter screenshot-qa-board build
