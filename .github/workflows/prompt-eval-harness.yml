name: Prompt Eval Harness

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/prompt-eval-harness/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/prompt-eval-harness.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter prompt-eval-harness lint
      - run: pnpm --filter prompt-eval-harness test
      - run: pnpm --filter prompt-eval-harness build
      - run: pnpm --filter prompt-eval-harness eval
